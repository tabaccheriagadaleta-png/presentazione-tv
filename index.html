<!DOCTYPE html>

<title>Estrazioni TV</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:white;
    color:#073684;
}

body{
    width:100vw;
    height:100vh;
}


/* =====================================================
   STRUTTURA GENERALE
===================================================== */

.schermo{

    width:100vw;
    height:100vh;

    padding:1vh 1vw 3vh;

    display:grid;

    grid-template-columns:
        40% 60%;

    gap:0.8vw;

}


.sinistra{

    min-height:0;

    display:grid;

    grid-template-rows:
        58% 42%;

    gap:0.8vh;

}


.destra{

    min-height:0;

    display:grid;

    grid-template-rows:
        72% 28%;

    gap:0.8vh;

}


.box{

    border:1.5px solid #bfc8d4;

    border-radius:14px;

    background:white;

    overflow:hidden;

    min-height:0;

}



/* =====================================================
   MILLIONDAY
===================================================== */

.million{

    padding:
        0.8vh
        0.8vw;

    display:grid;

    grid-template-rows:
        14% 43% 43%;

}


.million-logo{

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:900;

    font-style:italic;

    font-size:3vw;

    color:#ffb900;

}


.million-logo span{

    color:#087fd4;

}


.day{

    margin-left:0.4vw;

    color:#e52d24 !important;

    border:3px solid #17489d;

    padding:
        0
        0.2vw;

    font-size:2vw;

}


.estrazione{

    position:relative;

    border:
        1.5px solid
        #1688df;

    border-radius:12px;

    margin-top:1.3vh;

    padding:
        2.3vh
        1vw
        0.5vh;

}


.estrazione-titolo{

    position:absolute;

    top:-1.4vh;

    left:50%;

    transform:
        translateX(-50%);

    width:64%;

    text-align:center;

    padding:
        0.35vh
        0;

    color:white;

    background:#087bd3;

    border-radius:7px;

    font-size:1.05vw;

    font-weight:900;

}


.md-data{

    text-align:center;

    font-size:1vw;

    font-weight:900;

    margin-bottom:0.5vh;

}


.md-numeri{

    display:flex;

    justify-content:
        space-evenly;

    align-items:center;

}


.md-num{

    width:3.1vw;

    height:3.1vw;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#087bd3;

    color:white;

    font-size:1.45vw;

    font-weight:900;

}


.divisore{

    border-top:
        1px dotted
        #1688df;

    margin:
        0.6vh
        0;

}


.extra-riga{

    display:grid;

    grid-template-columns:
        15% 85%;

    align-items:center;

}


.extra-label{

    font-size:0.9vw;

    font-weight:900;

    color:#087bd3;

}


.md-extra{

    display:flex;

    justify-content:
        space-evenly;

}


.md-extra-num{

    width:2vw;

    height:2vw;

    border-radius:50%;

    border:
        1.5px solid
        #087bd3;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#073684;

    font-size:0.85vw;

    font-weight:900;

}



/* =====================================================
   10eLOTTO
===================================================== */

.dieci{

    padding:
        0.7vh
        0.9vw;

}


.dieci-header{

    height:16%;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

}


.dieci-logo{

    font-size:2.3vw;

    font-weight:900;

    font-style:italic;

    color:#073684;

}


.dieci-logo span{

    color:#ef6500;

}


.collegato{

    color:white;

    font-weight:900;

    font-size:0.65vw;

        0.5vw;

.titolo-piccolo{

    font-weight:900;

    font-size:0.65vw;

    margin-bottom:0.3vh;

}


.dieci-numeri{

    display:grid;

    grid-template-columns:
        repeat(10,1fr);

    gap:
        0.25vh

}


.dieci-num{

    width:100%;

    max-height:3.4vh;

    border-radius:50%;

    display:flex;

    justify-content:center;

    font-weight:900;

}


.oro-area{

    margin-top:0.5vh;

    border-top:

.oro-box{

.oro-box:first-child{

.oro-titolo{

    font-weight:900;

.extra15-titolo{

.extra15{

.extra15 span{

/* =====================================================
   LOTTO
===================================================== */

.lotto{

}


.lotto-header{

}


.lotto-logo{

}


.lotto-info{

}


.lotto-data{

}


.lotto-concorso{

    font-weight:900;

    margin-top:0.4vh;

}


.lotto-concorso span{

    color:#ef6500;

    font-size:1.15vw;

}


.lotto-corpo{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    border:
        1px solid
        #0b4398;

}


.lotto-colonna{

    display:grid;

    grid-template-rows:
        10% repeat(5,18%);

}


.lotto-colonna:first-child{

    border-right:
        1px solid
        #7ba3df;

}


.lotto-intestazione{

    display:grid;

    grid-template-columns:
        25% 60% 15%;

    background:#073d91;

    color:white;

    align-items:center;

    text-align:center;

    font-size:0.62vw;

    font-weight:900;

}


.ruota{

    display:grid;

    grid-template-columns:
        25% 60% 15%;

    align-items:center;

    border-top:
        1px solid
        #86a9dc;

}


.nome-ruota{

    padding-left:0.6vw;

    font-size:0.75vw;

    font-weight:900;

}


.numeri-ruota{

    display:flex;

    justify-content:
        space-around;

    font-size:1vw;

    font-weight:900;

    color:#111;

}


.numero-oro{

    text-align:center;

    color:#e17e00;

    font-size:1vw;

    font-weight:900;

}


.nazionale{

    display:grid;

    grid-template-columns:
        15% 72% 13%;

    align-items:center;

    border:
        1px solid
        #0b4398;

    border-top:none;

}


.nazionale

    font-size:0.78vw;

}


.nazionale

    font-size:1.25vw;

}



/* =====================================================
   SIMBOLOTTO
===================================================== */

.simbolotto{

    padding:
        0.7vh
        1vw;

}


.simbolotto-title{

    font-size:1.4vw;

    font-weight:900;

    color:#61208d;

    height:22%;

}


.simboli{

    height:78%;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

}


.simbolo{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}


.simbolo:not(:last-child){

    border-right:
        1px dotted
        #926cb7;

}


.sim-num{

    color:#61208d;

    font-size:0.9vw;

    font-weight:900;

}


.simbolo img{

    width:3.5vw;

    height:3.5vw;

    object-fit:contain;

}


.sim-emoji{

    width:3.5vw;

    height:3.5vw;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:2.4vw;

}


.sim-nome{

    font-size:0.58vw;

    font-weight:900;

    color:#111;

    text-transform:uppercase;

}



/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:fixed;

    bottom:0.35vh;

    left:1vw;

    right:1vw;

    height:2vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:0.66vw;

    font-weight:900;

    color:#073684;

}


.footer::before,
.footer::after{

    content:"";

    height:1px;

    background:#073684;

    flex:1;

    margin:
        0
        1vw;

}

</style>

</head>

<script>


function pad(n){

    return String(n)
        .padStart(2,"0");

}



function dataEstrazione(o){

    if(!o || !o.data){

        return "--";

    }

    return (

        (o.giorno || "")
        .toUpperCase()

        + " "

        + o.data

    );

}



function ruotaDati(v){

    if(Array.isArray(v)){

        return {

            numeri:v,

            oro:v[4]

        };

    }


    if(v){

        var nums =
            Array.isArray(v.numeri)
            ? v.numeri
            : [];


        return {

            numeri:nums,

            oro:
                v.oro !== undefined
                ? v.oro
                : nums[4]

        };

    }


    return {

        numeri:[],

        oro:""

    };

}



function creaRuota(nome,valore){

    var r =
        ruotaDati(valore);


    return `

    <div class="ruota">

        <div class="nome-ruota">

            ${nome.toUpperCase()}

        </div>


        <div class="numeri-ruota">

            ${
                r.numeri
                .map(function(n){

                    return pad(n);

                })
                .join(" ")
            }

        </div>


        <div class="numero-oro">

            ${
                r.oro !== ""
                ? pad(r.oro)
                : "--"
            }

        </div>


    </div>

    `;

}

45:["RONDINE","🐦"]

};



async function carica(){


try{


var response =
    await fetch(

        "data.json?t="
        + Date.now(),

        {

            cache:"no-store"

        }

    );


var d =
    await response.json();



/* =====================================================
   MILLIONDAY
===================================================== */


var m13 =

    d.millionday
    && d.millionday["13"]

    ? d.millionday["13"]

    : {};



var m20 =

    d.millionday
    && d.millionday["2030"]

    ? d.millionday["2030"]

    : {};



document.getElementById(
    "md13data"
).textContent =

).textContent =

document.getElementById(

).innerHTML =

document.getElementById(

document.getElementById(

var naz =

document.getElementById(

).innerHTML = `

<div class="nome-ruota">

NAZIONALE

</div>


<div class="numeri-ruota">

${
    naz.numeri
    .map(function(n){

        return pad(n);

    })
    .join(" ")
}

</div>


<div class="numero-oro">

${
    naz.oro !== ""

    : "--"
}

</div>

`;



/* =====================================================

===================================================== */


var sn =

    : [];

    d.simbolotto
    && d.simbolotto.simboli

    ? d.simbolotto.simboli

    : [];



document.getElementById(
    "simboli"
).innerHTML =

    sn
    .map(function(n,i){


        var info =
            SIMBOLI[n]
            || [
                "",
                "❖"
            ];


        var nome =
            nomi[i]
            || info[0];


        return `


        <div class="simbolo">


            <div class="sim-num">

                ${pad(n)}

            </div>


            <img

                src="simboli/${n}.png"

                onerror="
                    this.style.display='none';

                style="display:none">

                ${info[1]}

        `;
