<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estrazioni TV</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
    color:#002b72;
}

body{
    padding:0.3vw;
}

/* =========================================================
   STRUTTURA GENERALE
========================================================= */

.schermo{
    width:100%;
    height:calc(100vh - 1.6vw);
    display:grid;
    grid-template-columns:40% 60%;
    gap:0.6vw;
}

.sinistra{
    display:grid;
    grid-template-rows:57% 43%;
    gap:0.45vw;
    min-height:0;
}

.destra{
    display:grid;
    grid-template-rows:74% 26%;
    gap:0.45vw;
    min-height:0;
}

.box{
    background:#fff;
    border:1.5px solid #b8cbe8;
    border-radius:0.75vw;
    overflow:hidden;
    min-height:0;
}

/* =========================================================
   MILLIONDAY
========================================================= */

.millionday{
    padding:0.25vw 0.75vw 0.45vw;
    display:flex;
    flex-direction:column;
}

.md-logo{
    height:12%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-style:italic;
    font-size:2.75vw;
    letter-spacing:-0.15vw;
}

.md-milli{
    color:#ffb000;
}

.md-on{
    color:#087fc9;
}

.md-day{
    margin-left:0.15vw;
    color:#d9362b;
    border:0.15vw solid #174c91;
    padding:0 0.2vw;
    line-height:0.92;
    font-size:2vw;
    background:white;
}

.md-box{
    position:relative;
    border:1.5px solid #1487dd;
    border-radius:0.7vw;
    margin-top:0.45vw;
    padding:1.15vw 1vw 0.45vw;
    flex:1;
    min-height:0;
}

.md-title{
    position:absolute;
    top:-0.7vw;
    left:18%;
    right:18%;
    height:1.45vw;
    background:#1182cf;
    color:white;
    border-radius:0.4vw;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    font-size:1.05vw;
}

.md-data{
    text-align:center;
    font-size:1.05vw;
    font-weight:900;
    margin:0.05vw 0 0.35vw;
}

.md-numeri{
    display:flex;
    justify-content:space-around;
    align-items:center;
    margin:0.1vw 2.5vw 0.35vw;
}

.md-num{
    width:3vw;
    height:3vw;
    border-radius:50%;
    background:#0c82d4;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.25vw;
    font-weight:900;
}

.md-extra{
    border-top:1.5px dotted #5e9bd1;
    padding-top:0.35vw;
    display:grid;
    grid-template-columns:16% 84%;
    align-items:center;
}

.md-extra-label{
    color:#087bc6;
    font-size:1vw;
    font-weight:900;
}

.md-extra-numeri{
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.md-extra-num{
    width:2.5vw;
    height:2.5vw;
    border:1.5px solid #1487dd;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:1.05vw;
    font-weight:900;
    background:#fff;
}

/* =========================================================
   10 E LOTTO
========================================================= */

.diecilotto{
    padding:0.45vw 0.9vw 0.35vw;
    display:flex;
    flex-direction:column;
}

.dieci-header{
    height:18%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.dieci-logo{
    font-size:2.5vw;
    font-weight:900;
    font-style:italic;
    letter-spacing:-0.12vw;
}

.dieci-logo .blu{
    color:#073b82;
}

.dieci-logo .rosso{
    color:#ed4b0b;
}

.collegato{
    background:#073b82;
    color:#fff;
    font-size:0.7vw;
    font-weight:900;
    border-radius:0.25vw;
    padding:0.25vw 0.55vw;
}

.dieci-titolo{
    text-align:center;
    font-weight:900;
    font-size:0.78vw;
    margin-bottom:0.3vw;
}

.dieci-numeri{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:0.35vw;
    padding-bottom:0.35vw;

    /* divisore più evidente */
    border-bottom:1.5px solid #7faee1;
}

.dieci-num{
    width:2.55vw;
    height:2.55vw;
    margin:auto;
    background:#0c82d4;
    color:#fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    font-size:1.05vw;
}

.oro-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:3.8vw;

    /* divisore più evidente */
    border-bottom:1.5px solid #7faee1;
}

.oro-blocco{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.oro-blocco:first-child{
    border-right:1.5px solid #e0a64b;
}

.oro-label{
    color:#d66b00;
    font-size:0.7vw;
    font-weight:900;
    margin-bottom:0.15vw;
}

.oro-numeri{
    display:flex;
    gap:0.25vw;
}

.oro-num{
    width:2.25vw;
    height:2.25vw;
    border-radius:50%;
    background:#e88b00;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:0.9vw;
    font-weight:900;
}

.extra15-title{
    text-align:center;
    font-size:0.72vw;
    font-weight:900;
    margin:0.3vw 0;
}

.extra15{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.15vw;
}

.extra15 span{
    width:2.15vw;
    height:2.15vw;
    border:1.5px solid #8bbcec;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    font-size:0.76vw;
    background:white;
}

/* =========================================================
   LOTTO
========================================================= */

.lotto{
    display:flex;
    flex-direction:column;
    padding:0.35vw 0.75vw 0.25vw;
}

.lotto-top{
    height:12%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.lotto-logo{
    grid-column:2;
    display:flex;
    justify-content:center;
    align-items:center;
    line-height:1;
}

.lotto-letter{
    color:#ef5b00;
    font-size:3.25vw;
    font-weight:900;
}

.lotto-o{
    width:3.15vw;
    height:3.15vw;
    border:0.18vw solid #ef5b00;
    border-radius:50%;
    color:#ef5b00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.95vw;
    font-weight:900;
    margin:0 0.04vw;
}

.lotto-info{
    grid-column:3;
    justify-self:end;
    text-align:right;
    font-size:0.92vw;
    font-weight:900;
    line-height:1.8;
}

.lotto-info .concorso{
    color:#00357d;
}

.lotto-info .numero-concorso{
    color:#ed5b00;
    font-size:1.1vw;
}

.tabella-lotto{
    flex:1;
    border:1.5px solid #174f9d;
    display:grid;
    grid-template-rows:auto repeat(5,1fr) 0.72fr;
    min-height:0;
}

.lotto-head{
    display:grid;
    grid-template-columns:1fr 4fr 1fr 1fr 4fr 1fr;
    background:#0d4898;
    color:#fff;
    font-size:0.67vw;
    font-weight:900;
    text-align:center;
    align-items:center;
}

.riga-lotto{
    display:grid;
    grid-template-columns:1fr 4fr 1fr 1fr 4fr 1fr;
    align-items:center;

    /* LINEE LOTTO PIÙ EVIDENTI */
    border-top:1.5px solid #82aee0;
}

.riga-lotto > div:nth-child(3){
    border-right:1.5px solid #82aee0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.nome-ruota{
    font-size:0.94vw;
    font-weight:900;
    padding-left:0.55vw;
}

.numeri-ruota{
    display:flex;
    justify-content:space-around;
    align-items:center;
    color:#000;
    font-size:1.22vw;
    font-weight:900;
}

.numeri-ruota span{
    min-width:2.3vw;
    text-align:center;
}

.oro-ruota{
    text-align:center;
    color:#e77c00;
    font-size:1.15vw;
    font-weight:900;
}

.nazionale{
    display:grid;
    grid-template-columns:1.4fr 8fr 1fr;
    align-items:center;

    /* linea Nazionale più evidente */
    border-top:1.8px solid #5f96d4;
}

.nazionale .nome-ruota{
    font-size:0.94vw;
}

.nazionale .numeri-ruota{
    font-size:1.32vw;
}

/* =========================================================
   SIMBOLOTTO
========================================================= */

.simbolotto{
    padding:0.3vw 0.75vw 0.25vw;
    display:flex;
    flex-direction:column;
}

.simbolotto-header{
    height:20%;
    display:flex;
    justify-content:space-between;
    align-items:center;

    /* separazione più evidente */
    border-bottom:1.5px solid #c39bd5;
}

.simbolotto-title{
    color:#6e248e;
    font-size:1.35vw;
    font-weight:900;
}

.simbolotto-ruota{
    border:1.5px solid #ef8a00;
    border-radius:1vw;
    padding:0.2vw 0.55vw;
    color:#00357d;
    font-size:0.72vw;
    font-weight:900;
}

.simbolotto-ruota span{
    color:#ed7100;
}

.simboli{
    height:80%;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;
}

.simbolo{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* divisori Simbolotto più evidenti */
.simbolo:not(:last-child){
    border-right:1.5px dotted #b47cc9;
}

.simbolo-numero{
    color:#6d1a86;
    font-weight:900;
    font-size:0.92vw;
    margin-bottom:0.2vw;
}

.simbolo img{
    max-width:5vw;
    max-height:4.7vw;
    object-fit:contain;
}

/* Fallback se un'immagine non viene trovata */
.simbolo-fallback{
    width:3.8vw;
    height:3.8vw;
    align-items:center;
    justify-content:center;
    font-size:2.3vw;
    display:none;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    position:fixed;
    bottom:0.15vw;
    right:0.6vw;
    font-size:0.5vw;
    color:#8a8a8a;
}

</style>
</head>

<body>

<div class="schermo">

    <!-- =====================================================
         COLONNA SINISTRA
    ====================================================== -->

    <div class="sinistra">

        <!-- MILLIONDAY -->
        <section class="box millionday">

            <div class="md-logo">
                <span class="md-milli">Milli</span>
                <span class="md-on">On</span>
                <span class="md-day">DAY</span>
            </div>

            <div class="md-box">
                <div class="md-title">◷ ESTRAZIONE ORE 13:00</div>

                <div class="md-data" id="md13data">--</div>

                <div class="md-numeri" id="md13numeri"></div>

                <div class="md-extra">
                    <div class="md-extra-label">EXTRA</div>
                    <div class="md-extra-numeri" id="md13extra"></div>
                </div>
            </div>

            <div class="md-box">
                <div class="md-title">◷ ESTRAZIONE ORE 20:30</div>

                <div class="md-data" id="md2030data">--</div>

                <div class="md-numeri" id="md2030numeri"></div>

                <div class="md-extra">
                    <div class="md-extra-label">EXTRA</div>
                    <div class="md-extra-numeri" id="md2030extra"></div>
                </div>
            </div>

        </section>

        <!-- 10 E LOTTO -->
        <section class="box diecilotto">

            <div class="dieci-header">

                <div class="dieci-logo">
                    <span class="blu">10e</span><span class="rosso">LOTTO</span>
                </div>

                <div class="collegato">
                    COLLEGATO AL LOTTO
                </div>

            </div>

            <div class="dieci-titolo">
                ESTRAZIONE PRINCIPALE
            </div>

            <div class="dieci-numeri" id="dieciNumeri"></div>

            <div class="oro-area">

                <div class="oro-blocco">
                    <div class="oro-label">NUMERO ORO</div>
                    <div class="oro-numeri" id="numeroOro"></div>
                </div>

                <div class="oro-blocco">
                    <div class="oro-label">DOPPIO ORO</div>
                    <div class="oro-numeri" id="doppioOro"></div>
                </div>

            </div>

            <div class="extra15-title">
                ESTRAZIONE EXTRA 15 NUMERI
            </div>

            <div class="extra15" id="extra15"></div>

        </section>

    </div>

    <!-- =====================================================
         COLONNA DESTRA
    ====================================================== -->

    <div class="destra">

        <!-- LOTTO -->
        <section class="box lotto">

            <div class="lotto-top">

                <div></div>

                <div class="lotto-logo">
                    <span class="lotto-letter">L</span>
                    <span class="lotto-o">O</span>
                    <span class="lotto-letter">T</span>
                    <span class="lotto-letter">T</span>
                    <span class="lotto-o">O</span>
                </div>

                <div class="lotto-info">
                    <div id="lottoData">--</div>
                    <div class="concorso">
                        CONCORSO N.
                        <span class="numero-concorso" id="lottoConcorso">--</span>
                    </div>
                </div>

            </div>

            <div class="tabella-lotto">

                <div class="lotto-head">
                    <div>RUOTA</div>
                    <div>NUMERI ESTRATTI</div>
                    <div>ORO</div>
                    <div>RUOTA</div>
                    <div>NUMERI ESTRATTI</div>
                    <div>ORO</div>
                </div>

                <div class="riga-lotto" id="lottoRiga1"></div>
                <div class="riga-lotto" id="lottoRiga2"></div>
                <div class="riga-lotto" id="lottoRiga3"></div>
                <div class="riga-lotto" id="lottoRiga4"></div>
                <div class="riga-lotto" id="lottoRiga5"></div>

                <div class="nazionale" id="lottoNazionale"></div>

            </div>

        </section>

        <!-- SIMBOLOTTO -->
        <section class="box simbolotto">

            <div class="simbolotto-header">

                <div class="simbolotto-title">
                    ✿ SIMBOLOTTO
                </div>

                <div class="simbolotto-ruota" id="simbolottoRuota">
                    RUOTA ASSOCIATA:
                    <span>--</span>
                </div>

            </div>

            <div class="simboli" id="simboli"></div>

        </section>

    </div>

</div>

<div class="footer" id="aggiornamento"></div>

<script>

/* =========================================================
   NOMI SIMBOLOTTO
========================================================= */

var SIMBOLI = {
    1:"ITALIA",
    2:"MELA",
    3:"GATTA",
    4:"MAIALE",
    5:"MANO",
    6:"LUNA",
    7:"VASO",
    8:"BRAGHE",
    9:"CULLA",
    10:"FAGIOLI",
    11:"TOPI",
    12:"SOLDATO",
    13:"RANA",
    14:"BAULE",
    15:"RAGAZZO",
    16:"NASO",
    17:"SFORTUNA",
    18:"CERINO",
    19:"RISATA",
    20:"FESTA",
    21:"LUPO",
    22:"BALESTRA",
    23:"AMO",
    24:"PIZZA",
    25:"NATALE",
    26:"ELMO",
    27:"SCALA",
    28:"OMBRELLO",
    29:"DIAMANTE",
    30:"CACIO",
    31:"ANGURIA",
    32:"DISCO",
    33:"ELICA",
    34:"TESTA",
    35:"UCCELLO",
    36:"NACCHERE",
    37:"PIANO",
    38:"PIGNA",
    39:"FORBICI",
    40:"QUADRO",
    41:"BUFFONE",
    42:"CAFFÈ",
    43:"FUNGHI",
    44:"PRIGIONE",
    45:"RONDINE"
};

/* =========================================================
   RUOTA SIMBOLOTTO PER MESE
========================================================= */

var RUOTE_SIMBOLOTTO = [
    "",
    "BARI",
    "CAGLIARI",
    "FIRENZE",
    "GENOVA",
    "MILANO",
    "NAPOLI",
    "NAZIONALE",
    "NAZIONALE",
    "PALERMO",
    "ROMA",
    "TORINO",
    "VENEZIA"
];

function ruotaSimbolotto(){

    var oggi = new Date();
    var mese = oggi.getMonth() + 1;

    return RUOTE_SIMBOLOTTO[mese] || "--";
}

/* =========================================================
   FUNZIONI UTILI
========================================================= */

function dueCifre(numero){

    var n = parseInt(numero,10);

    if(isNaN(n)){
        return "--";
    }

    return n < 10 ? "0" + n : String(n);
}

function creaCerchi(lista, classe){

    if(!Array.isArray(lista)){
        return "";
    }

    return lista.map(function(n){
        return '<div class="' + classe + '">' + dueCifre(n) + '</div>';
    }).join("");
}

function creaSpan(lista){

    if(!Array.isArray(lista)){
        return "";
    }

    return lista.map(function(n){
        return "<span>" + dueCifre(n) + "</span>";
    }).join("");
}

/* =========================================================
   MILLIONDAY
========================================================= */

function mostraMillionDay(idPrefix, estrazione){

    estrazione = estrazione || {};

    var data = "--";

    if(estrazione.data){
        data = estrazione.giorno
            ? estrazione.giorno.toUpperCase() + " " + estrazione.data
            : estrazione.data;
    }

    document.getElementById(idPrefix + "data").textContent = data;

    document.getElementById(idPrefix + "numeri").innerHTML =
        creaCerchi(estrazione.numeri || [], "md-num");

    document.getElementById(idPrefix + "extra").innerHTML =
        creaCerchi(estrazione.extra || [], "md-extra-num");
}

/* =========================================================
   LOTTO
========================================================= */

function creaRuota(nome, valori){

    valori = valori || [];

    var numeri = valori.slice(0,5);
    var oro = valori.length ? valori[valori.length - 1] : "";

    /*
       Nel JSON attuale ogni ruota può essere:
       [n1,n2,n3,n4,n5,oro]
       oppure semplicemente i 5 numeri.

       Se ci sono solo 5 numeri, l'Oro corrisponde
       all'ultimo valore fornito dal backend.
    */

    if(valori.length >= 6){
        oro = valori[5];
    }

    return '' +
        '<div class="nome-ruota">' + nome + '</div>' +
        '<div class="numeri-ruota">' + creaSpan(numeri) + '</div>' +
        '<div class="oro-ruota">' + dueCifre(oro) + '</div>';
}

function mostraLotto(lotto){

    lotto = lotto || {};
    var ruote = lotto.ruote || {};

    var data = "--";

    if(lotto.data){
        data = lotto.giorno
            ? lotto.giorno.toUpperCase() + " " + lotto.data
            : lotto.data;
    }

    document.getElementById("lottoData").textContent = data;
    document.getElementById("lottoConcorso").textContent =
        lotto.concorso || "--";

    var coppie = [
        ["BARI","FIRENZE"],
        ["CAGLIARI","GENOVA"],
        ["MILANO","NAPOLI"],
        ["PALERMO","ROMA"],
        ["TORINO","VENEZIA"]
    ];

    coppie.forEach(function(coppia,indice){

        var sx = coppia[0];
        var dx = coppia[1];

        document.getElementById("lottoRiga" + (indice+1)).innerHTML =
            creaRuota(sx,ruote[sx] || []) +
            creaRuota(dx,ruote[dx] || []);
    });

    var nazionale = ruote["NAZIONALE"] || [];

    document.getElementById("lottoNazionale").innerHTML =
        '<div class="nome-ruota">NAZIONALE</div>' +
        '<div class="numeri-ruota">' +
            creaSpan(nazionale.slice(0,5)) +
        '</div>' +
        '<div class="oro-ruota">' +
            dueCifre(nazionale.length >= 6 ? nazionale[5] : nazionale[nazionale.length-1]) +
        '</div>';
}

/* =========================================================
   10 E LOTTO
========================================================= */

function mostra10eLotto(dieci){

    dieci = dieci || {};

    document.getElementById("dieciNumeri").innerHTML =
        creaCerchi(dieci.numeri || [], "dieci-num");

    var oro = [];

    if(dieci.oro !== "" &&
       dieci.oro !== null &&
       dieci.oro !== undefined){
        oro = [dieci.oro];
    }

    document.getElementById("numeroOro").innerHTML =
        creaCerchi(oro,"oro-num");

    document.getElementById("doppioOro").innerHTML =
        creaCerchi(dieci.doppio_oro || [],"oro-num");

    var extra = dieci.extra || [];

    document.getElementById("extra15").innerHTML =
        extra.map(function(n){
            return "<span>" + dueCifre(n) + "</span>";
        }).join("");
}

/* =========================================================
   SIMBOLOTTO
========================================================= */

function mostraSimbolotto(simbolotto){

    simbolotto = simbolotto || {};

    document.querySelector("#simbolottoRuota span").textContent =
        ruotaSimbolotto();

    var numeri = simbolotto.numeri || [];

    var html = "";

    numeri.forEach(function(n){

        n = parseInt(n,10);

        var nome = SIMBOLI[n] || "";

        /*
           Trasforma:
           MAIALE -> Maiale
           CACIO  -> Cacio
           CAFFÈ  -> Caffè

           In questo modo corrisponde ai nomi
           dei PNG caricati su GitHub.
        */

        var nomeFile = nome.charAt(0).toUpperCase() +
                       nome.slice(1).toLowerCase();

        html +=
            '<div class="simbolo">' +

                '<div class="simbolo-numero">' +
                    dueCifre(n) +
                '</div>' +

                '<img src="simboli/' +
                    n + ' ' + nomeFile + '.png"' +
                    ' onerror="' +
                        "this.style.display='none';" +
                        "this.nextElementSibling.style.display='flex';" +
                    '">' +

                '<div class="simbolo-fallback">✿</div>' +

            '</div>';
    });

    document.getElementById("simboli").innerHTML = html;
}

/* =========================================================
   CARICAMENTO DATA.JSON
========================================================= */

function aggiorna(){

    fetch("data.json?t=" + Date.now(),{
        cache:"no-store"
    })

    .then(function(response){

        if(!response.ok){
            throw new Error("Errore caricamento data.json");
        }

        return response.json();
    })

    .then(function(data){

        mostraMillionDay(
            "md13",
            data.millionday && data.millionday["13"]
                ? data.millionday["13"]
                : {}
        );

        mostraMillionDay(
            "md2030",
            data.millionday && data.millionday["2030"]
                ? data.millionday["2030"]
                : {}
        );

        mostraLotto(data.lotto || {});

        mostra10eLotto(data["10elotto"] || {});

        mostraSimbolotto(data.simbolotto || {});

        if(data.ultimo_aggiornamento){

            document.getElementById("aggiornamento").textContent =
                "Aggiornato: " + data.ultimo_aggiornamento;
        }

    })

    .catch(function(error){

        console.error(error);

        document.getElementById("aggiornamento").textContent =
            "Errore aggiornamento dati";
    });
}

/* primo caricamento */
aggiorna();

/* aggiornamento automatico ogni minuto */
setInterval(aggiorna,60000);

</script>
