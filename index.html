<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estrazioni TV</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#073684;
}

body{
    width:100vw;
    height:100vh;
}


/* =========================
   STRUTTURA GENERALE
========================= */

.schermo{
    width:100vw;
    height:100vh;
    padding:1vh 1vw 3vh;

    display:grid;
    grid-template-columns:40% 60%;
    gap:0.7vw;
}

.sinistra{
    min-height:0;

    display:grid;
    grid-template-rows:57% 43%;
    gap:0.7vh;
}

.destra{
    min-height:0;

    display:grid;
    grid-template-rows:70% 30%;
    gap:0.7vh;
}

.box{
    min-height:0;
    border:1.5px solid #bdc8d8;
    border-radius:14px;
    background:#fff;
    overflow:hidden;
}


/* =========================
   MILLIONDAY
========================= */

.million{
    padding:0.6vh 0.8vw;

    display:grid;
    grid-template-rows:13% 43.5% 43.5%;
}

.million-logo{
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:2.8vw;
    line-height:1;

    font-weight:900;
    font-style:italic;

    color:#ffb600;
}

.million-logo .o{
    color:#087ed5;
}

.day{
    margin-left:0.35vw;

    color:#e62f25;

    border:3px solid #16499c;

    padding:0 0.2vw;

    font-size:2vw;
}

.estrazione{
    position:relative;

    margin-top:1.1vh;

    border:1.5px solid #1688df;
    border-radius:12px;

    padding:2.3vh 1vw 0.5vh;
}

.estrazione-titolo{
    position:absolute;

    top:-1.35vh;
    left:50%;

    transform:translateX(-50%);

    width:64%;

    padding:0.35vh 0;

    text-align:center;

    color:#fff;
    background:#087bd3;

    border-radius:7px;

    font-size:1.05vw;
    font-weight:900;
}

.md-data{
    text-align:center;

    font-size:1vw;
    font-weight:900;

    margin-bottom:0.5vh;
}

.md-numeri{
    display:flex;

    justify-content:space-evenly;
    align-items:center;
}

.md-num{
    width:3vw;
    height:3vw;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#087bd3;
    color:#fff;

    font-size:1.35vw;
    font-weight:900;
}

.divisore{
    border-top:1px dotted #1688df;

    margin:0.6vh 0;
}

.extra-riga{
    display:grid;

    grid-template-columns:15% 85%;

    align-items:center;
}

.extra-label{
    color:#087bd3;

    font-size:0.9vw;
    font-weight:900;
}

.md-extra{
    display:flex;

    justify-content:space-evenly;
}

.md-extra-num{
    width:2.1vw;
    height:2.1vw;

    border:1.5px solid #087bd3;
    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#073684;
    background:#fff;

    font-size:0.9vw;
    font-weight:900;
}


/* =========================
   10eLOTTO
========================= */

.dieci{
    padding:0.7vh 0.9vw;

    display:grid;

    grid-template-rows:
        16%
        7%
        31%
        22%
        7%
        17%;
}

.dieci-header{
    display:flex;

    align-items:center;
    justify-content:space-between;
}

.dieci-logo{
    font-size:2.3vw;

    font-weight:900;
    font-style:italic;

    color:#073684;
}

.dieci-logo span{
    color:#ef6500;
}

.collegato{
    background:#073684;
    color:#fff;

    font-size:0.65vw;
    font-weight:900;

    padding:0.35vh 0.5vw;

    border-radius:5px;
}

.titolo-piccolo{
    display:flex;

    align-items:center;
    justify-content:center;

    font-size:0.68vw;
    font-weight:900;
}

.dieci-numeri{
    height:100%;

    display:grid;

    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(2,1fr);

    gap:0.35vh 0.3vw;

    align-items:center;
}

.dieci-num{
    width:100%;
    height:80%;

    border:1.3px solid #a4c4ee;
    border-radius:999px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#073684;

    font-size:0.8vw;
    font-weight:900;
}

.oro-area{
    height:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    border-top:1px solid #9cb7db;
    border-bottom:1px solid #9cb7db;
}

.oro-box{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;
}

.oro-box:first-child{
    border-right:1px solid #e7aa51;
}

.oro-titolo{
    color:#dd7900;

    font-size:0.64vw;
    font-weight:900;

    margin-bottom:0.3vh;
}

.oro-num{
    display:inline-flex;

    width:1.7vw;
    height:1.7vw;

    align-items:center;
    justify-content:center;

    margin:0 0.08vw;

    border-radius:50%;

    background:#df8a00;
    color:#fff;

    font-size:0.7vw;
    font-weight:900;
}

.extra15-titolo{
    display:flex;

    align-items:center;
    justify-content:center;

    font-size:0.64vw;
    font-weight:900;
}

.extra15{
    height:100%;

    display:grid;

    grid-template-columns:repeat(15,1fr);

    align-items:center;

    gap:0.15vw;
}

.extra15 span{
    width:100%;

    aspect-ratio:1;

    border:1px solid #a6bfe4;
    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#073684;

    font-size:0.58vw;
    font-weight:900;
}


/* =========================
   LOTTO
========================= */

.lotto{
    padding:0.7vh 0.8vw;

    display:grid;

    grid-template-rows:
        13%
        77%
        10%;
}

.lotto-header{
    display:grid;

    grid-template-columns:55% 45%;

    align-items:center;
}

.lotto-logo{
    text-align:center;

    color:#073684;

    font-size:3vw;
    font-weight:900;

    letter-spacing:0.08em;
}

.lotto-info{
    text-align:right;

    padding-right:0.5vw;
}

.lotto-data{
    font-size:1vw;
    font-weight:900;
}

.lotto-concorso{
    margin-top:0.4vh;

    font-size:0.85vw;
    font-weight:900;
}

.lotto-concorso span{
    color:#ef6500;

    font-size:1.15vw;
}

.lotto-corpo{
    height:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    border:1px solid #0b4398;
}

.lotto-colonna{
    min-height:0;

    display:grid;

    grid-template-rows:9% 91%;
}

.lotto-colonna:first-child{
    border-right:1px solid #7ba3df;
}

.lotto-intestazione{
    display:grid;

    grid-template-columns:25% 60% 15%;

    align-items:center;

    text-align:center;

    background:#073d91;
    color:#fff;

    font-size:0.62vw;
    font-weight:900;
}

#lottoSinistra,
#lottoDestra{
    height:100%;

    display:grid;

    grid-template-rows:repeat(5,1fr);
}

.ruota{
    min-height:0;

    display:grid;

    grid-template-columns:25% 60% 15%;

    align-items:center;

    border-top:1px solid #86a9dc;
}

.nome-ruota{
    padding-left:0.6vw;

    color:#073684;

    font-size:0.78vw;
    font-weight:900;
}

.numeri-ruota{
    display:flex;

    justify-content:space-around;
    align-items:center;

    color:#111;

    font-size:1.08vw;
    font-weight:900;

    letter-spacing:0.04em;
}

.numero-oro{
    text-align:center;

    color:#e17e00;

    font-size:1.08vw;
    font-weight:900;
}

.nazionale{
    height:100%;

    display:grid;

    grid-template-columns:15% 72% 13%;

    align-items:center;

    border:1px solid #0b4398;
    border-top:none;
}

.nazionale .nome-ruota{
    font-size:0.78vw;
}

.nazionale .numeri-ruota{
    font-size:1.25vw;
}

.nazionale .numero-oro{
    font-size:1.1vw;
}


/* =========================
   SIMBOLOTTO
========================= */

.simbolotto{
    padding:0.6vh 1vw;
}

.simbolotto-title{
    height:18%;

    display:flex;

    align-items:center;

    color:#61208d;

    font-size:1.45vw;
    font-weight:900;
}

.simboli{
    height:82%;

    display:grid;

    grid-template-columns:repeat(5,1fr);
}

.simbolo{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;
}

.simbolo:not(:last-child){
    border-right:1px dotted #926cb7;
}

.sim-num{
    margin-bottom:0.15vh;

    color:#61208d;

    font-size:1vw;
    font-weight:900;
}

.simbolo img{
    width:4.7vw;
    height:4.7vw;

    object-fit:contain;
}

.sim-emoji{
    width:4.7vw;
    height:4.7vw;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:3vw;
}

.sim-nome{
    margin-top:0.2vh;

    color:#111;

    font-size:0.68vw;
    font-weight:900;

    text-align:center;
    text-transform:uppercase;
}


/* =========================
   FOOTER
========================= */

.footer{
    position:fixed;

    left:1vw;
    right:1vw;
    bottom:0.35vh;

    height:2vh;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#073684;

    font-size:0.62vw;
    font-weight:900;
}

.footer::before,
.footer::after{
    content:"";

    flex:1;

    height:1px;

    margin:0 1vw;

    background:#073684;
}

</style>
</head>

<script>


/* =========================
   FUNZIONI
========================= */

function pad(n){

    return String(n).padStart(2,"0");

}


function dataEstrazione(o){

    if(!o || !o.data){
        return "--";
    }

    return (
        (o.giorno || "").toUpperCase()
        + " "
        + o.data
    );

}


/* =========================
   LOTTO
========================= */

function ruotaDati(v){

    if(Array.isArray(v)){

        return {
            numeri:v,
            oro:v[4]
        };

    }


    if(v && typeof v === "object"){

        var nums =
            Array.isArray(v.numeri)
            ? v.numeri
            : [];

        return {

            numeri:nums,

            oro:
                v.oro !== undefined
                ? v.oro
                : nums[4]

        };

    }


    return {
        numeri:[],
        oro:""
    };

}


function creaRuota(nome,valore){

    var r =
        ruotaDati(valore);


    return `

        <div class="ruota">

            <div class="nome-ruota">
                ${nome.toUpperCase()}
            </div>

            <div class="numeri-ruota">

                ${
                    r.numeri
                    .map(function(n){
                        return pad(n);
                    })
                    .join(" ")
                }

            </div>

            <div class="numero-oro">

                ${
                    r.oro !== ""
                    ? pad(r.oro)
                    : "--"
                }

            </div>

        </div>

    `;

}

`;



/* =========================
   SIMBOLOTTO
========================= */

var sn =
    d.simbolotto &&
    d.simbolotto.numeri

    ? d.simbolotto.numeri
    : [];


var nomi =
    d.simbolotto &&
    d.simbolotto.simboli

    ? d.simbolotto.simboli
    : [];


document.getElementById(
    "simboli"
).innerHTML =

    sn
    .map(function(n,i){


        var info =
            SIMBOLI[n]
            || [
                "",
                "❖"
            ];


        var nome =
            nomi[i]
            || info[0];


        return `

            <div class="simbolo">

                <div class="sim-num">
                    ${pad(n)}
                </div>


                <img
                    src="simboli/${n}.png"

                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >


                <div
                    class="sim-emoji"
                    style="display:none">

                    ${info[1]}

                </div>


                <div class="sim-nome">
                    ${nome}
                </div>

            </div>

        `;

    })
    .join("");



/* =========================
   AGGIORNAMENTO
========================= */

document.getElementById(
    "footer"
).textContent =

    "AGGIORNATO AUTOMATICAMENTE  |  "

    +

    (
        d.ultimo_aggiornamento
        || "--"
    );


}

catch(e){

    console.log(
        "Errore caricamento:",
        e
    );

}

}


/* PRIMO CARICAMENTO */

carica();


/* RICARICA DATA.JSON OGNI 60 SECONDI */

setInterval(
    carica,
    60000
);


</script>

</body>
</html>
